name: swe-elevation-warming
channels:
  - conda-forge
dependencies:

  - python=3.11.7

  # Core numerics and data
  - numpy=2.2.6
  - scipy=1.15.3
  - pandas=2.2.3
  - pyarrow=20.0.0
  - bottleneck=1.5.0
  - numba=0.61.2
  - cython=3.1.1

  # xarray and gridded data
  - xarray=2025.4.0
  - dask=2025.5.0
  - distributed=2025.5.0
  - flox=0.10.3
  - numbagg=0.9.0
  - sparse=0.17.0
  - zarr=3.0.8
  - netcdf4=1.7.2
  - h5netcdf=1.6.1
  - h5py=3.13.0
  - nc-time-axis=1.4.1
  - cfgrib=0.9.15.0
  - python-eccodes
  - pyhdf=0.11.6

  # Geospatial
  - rasterio=1.4.3
  - rioxarray=0.19.0
  - geopandas=1.0.1
  - shapely=2.1.1
  - pyproj=3.7.1
  - pyogrio=0.11.0
  - cartopy=0.24.1

  # Remote data access
  - s3fs=2025.3.2
  - earthaccess=0.14.0
  - requests=2.32.3
  - pooch=1.8.2

  # Statistics
  - scikit-learn=1.6.1
  - statsmodels=0.14.4

  # Plotting
  - matplotlib=3.10.3
  - seaborn=0.13.2
  - bokeh=3.7.3

  # Neuroimaging
  - nipype=1.11.0
  - nibabel=5.4.2

  # Documents and parsing
  - pymupdf=1.28.0
  - beautifulsoup4=4.13.4
  - lxml=6.1.1
  - pyyaml=6.0.2

  # Web / async (possibly leftovers; remove if unused)
  - uvicorn=0.50.2
  - starlette=1.3.1
  - aiofiles=25.1.0

  # Jupyter
  - jupyterlab=4.4.2
  - notebook=7.4.2
  - ipykernel=6.29.5
  - ipywidgets=8.1.7
  - tqdm=4.67.1

  - pip
  - pip:
      # Not reliably available on conda-forge
      - cdsapi==0.7.6
      - ecmwf-datastores-client==0.2.0
      - pqdm==0.2.0
      - piecewise-regression==1.5.0
      - pwlf==2.5.1
      - pymannkendall==1.4.3
